<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <section id="admin">

        <h2>Admin Login</h2>

        <br>

        <input
            type="text"
            id="username"
            placeholder="Username"
        >

        <br><br>

        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
        >

        <br><br>

        <button onclick="loginAdmin()">
            Login
        </button>

    </section>


    <script>

        function loginAdmin() {

            let user =
                document.getElementById("username").value;

            let pass =
                document.getElementById("loginPassword").value;

            if (
                user === "admin" &&
                pass === "1234"
            ) {

                alert("Login Successful");

                window.location.href =
                    "index.html";

            }

            else {

                alert("Invalid Login");

            }

        }

    </script>

</body>

</html>
